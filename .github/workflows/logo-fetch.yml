# Temporary: fetches vendor logo candidates on the scratch branch only. Not for merging.
name: Logo fetch (temporary)
on:
  push:
    branches: [scratch/logo-fetch]
    paths: [scripts/fetch-logo-candidates.py, .github/workflows/logo-fetch.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
      - run: python scripts/fetch-logo-candidates.py
      - run: |
          git config user.name "logo-fetch"
          git config user.email "actions@users.noreply.github.com"
          git add logo-candidates
          git commit -m "Logo candidates (temporary)" || echo nothing
          git push
